<style>
:focus-visible{outline:3px solid #1a73e8!important;outline-offset:2px}
html.a11y-zoom-1{zoom:1.15}
html.a11y-zoom-2{zoom:1.32}
.a11y-btn{background:#fff;border:2px solid #555;color:#222;font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer;line-height:1.3;white-space:nowrap}
.a11y-btn:hover{background:#eef4ff}
.a11y-fixed{position:fixed;right:12px;bottom:12px;z-index:9999;box-shadow:0 3px 10px rgba(0,0,0,.3)}
</style>
<script>
(function(){
  "use strict";
  /* ---- alt text: fill from the row title for thumbnails that lack it ---- */
  try{
    document.querySelectorAll('img').forEach(function(img){
      if(img.hasAttribute('alt') && img.getAttribute('alt') !== '') return;
      var tr = img.closest ? img.closest('tr') : null;
      if(tr){
        var t = '';
        var cells = tr.querySelectorAll('td');
        for(var i=0;i<cells.length;i++){ var tx = cells[i].textContent.trim(); if(tx.length>=2 && !/^\d+$/.test(tx) && tx.indexOf('http')!==0){ t = tx; break; } }
        if(t) img.setAttribute('alt', t.slice(0, 80));
        else if(!img.hasAttribute('alt')) img.setAttribute('alt', '');
      } else if(!img.hasAttribute('alt')) img.setAttribute('alt', '');
    });
  }catch(e){}
  /* ---- aria labels for icon buttons + landmarks ---- */
  try{
    document.querySelectorAll('.snd-btn').forEach(function(b){ if(!b.getAttribute('aria-label')) b.setAttribute('aria-label','音のオン・オフ'); });
    document.querySelectorAll('.nb-all-btn,.nb-icon-btn').forEach(function(b){ if(!b.getAttribute('aria-label')) b.setAttribute('aria-label','書いて帳を全件表示'); });
    var tb=document.querySelector('.topbar,.volbar'); if(tb && !tb.getAttribute('role')) tb.setAttribute('role','banner');
    var nv=document.querySelector('.topnav'); if(nv){ nv.setAttribute('role','navigation'); nv.setAttribute('aria-label','目次'); }
  }catch(e){}
  /* ---- large-text (zoom) button for presbyopia ---- */
  var level=0;
  try{ level=parseInt(localStorage.getItem('zkeA11yZoom')||'0',10)||0; }catch(e){}
  function apply(){
    document.documentElement.classList.remove('a11y-zoom-1','a11y-zoom-2');
    if(level===1) document.documentElement.classList.add('a11y-zoom-1');
    if(level===2) document.documentElement.classList.add('a11y-zoom-2');
    btn.textContent='🔎 文字を大きく（'+['通常','大','特大'][level]+'）';
    btn.setAttribute('aria-pressed', level>0?'true':'false');
    try{ localStorage.setItem('zkeA11yZoom', String(level)); }catch(e){}
  }
  var btn=document.createElement('button');
  btn.type='button'; btn.className='a11y-btn'; btn.id='a11yBtn';
  btn.setAttribute('aria-label','文字の大きさを切り替える（老眼の方など、読みやすくするためのボタン）');
  btn.addEventListener('click', function(){ level=(level+1)%3; apply(); });
  var bar=document.querySelector('.topbar,.volbar');
  if(bar) bar.appendChild(btn); else { btn.classList.add('a11y-fixed'); document.body.appendChild(btn); }
  apply();
})();
</script>
