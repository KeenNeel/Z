<style id="nb5style">
/* ===== v50 NB5: notebook atmosphere — no frames, handwriting font, faint gray actions ===== */
.nb-card{background:transparent!important;border:none!important;box-shadow:none!important;padding:2px 6px!important}
.nb-card .nb-text{font-family:'Klee One','Yomogi','Hiragino Maru Gothic ProN','Hiragino Sans',cursive!important;font-size:16.5px;line-height:1.75;color:#2b2b26}
.nb-card .nb-meta{font-size:10.5px!important;color:#a3a099!important}
.nb-card .nb-acts button,.nb-card .nb-repmenu button{font-size:10.5px!important;color:#a8a49c!important;background:none!important;border:none!important;opacity:.8;padding:1px 5px!important;cursor:pointer;text-decoration:underline dotted}
.nb-card .nb-acts button:hover,.nb-card .nb-repmenu button:hover{color:#555!important;opacity:1}
.nb-card .nb-editbox textarea{font-family:'Klee One','Yomogi','Hiragino Maru Gothic ProN',cursive!important;background:rgba(255,255,255,.55)!important;border:1px dashed rgba(150,130,80,.45)!important;border-radius:6px}
.nb-card .nb-editbox .nb-row button{font-size:11px!important;color:#8a8578!important;background:none!important;border:1px solid #cfc9ba!important;border-radius:999px;padding:2px 10px!important}
.nb-rsz{position:absolute;right:1px;bottom:1px;width:16px;height:16px;cursor:nwse-resize;opacity:.35;touch-action:none;background:linear-gradient(135deg,transparent 55%,#9a917c 55%,#9a917c 70%,transparent 70%,transparent 82%,#9a917c 82%)}
.nb-rsz:hover{opacity:.8}
#nbFormWin{background:rgba(255,253,244,.97)!important;border:1.5px dashed rgba(150,130,80,.55)!important;box-shadow:0 10px 30px rgba(60,50,20,.18)!important}
#nbFormWin .fw-head{background:transparent!important;border-bottom:1px dashed rgba(150,130,80,.35)!important;color:#8a7a4d!important}
#nbFormWin textarea{font-family:'Klee One','Yomogi','Hiragino Maru Gothic ProN',cursive!important;font-size:16.5px!important;line-height:1.75;background:rgba(255,255,255,.5)!important}
#nbFormWin .nb-row button,#nbFormWin button{border-radius:999px}
</style>
<script>
(function(){
"use strict";
/* ===== v50 NB5: textbox geometry, overlap guard, double-click edit, live refresh ===== */
var API="https://script.google.com/macros/s/AKfycbwogV0XO0IQNhCfPoyPKmEwUKcC1Ed1obpgB47J_oF6-pOlsLhzZE85fHAJ_0fShlqM/exec";
try{
  var lk=document.createElement('link'); lk.rel='stylesheet';
  lk.href='https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap';
  document.head.appendChild(lk);
}catch(e){}
function E(id){ return document.getElementById(id); }
function gateCode(){ try{ return sessionStorage.getItem("zkeGateCode")||""; }catch(e){ return ""; } }
function tokensCsv(){ try{ return (JSON.parse(localStorage.getItem("zkeMyTokens")||"[]")).join(","); }catch(e){ return ""; } }
function myName(){ var n=E("nbName"); return n?n.value:""; }
function jsonp(params,cb){
  var cbn="__nb5cb"+Math.random().toString(36).slice(2,9), done=false;
  var timer=setTimeout(function(){ if(!done){ done=true; cb(new Error("t")); } },12000);
  window[cbn]=function(d){ if(done) return; done=true; clearTimeout(timer); cb(null,d); try{ delete window[cbn]; }catch(e){} };
  var qs=Object.keys(params).map(function(k){ return k+"="+encodeURIComponent(params[k]); }).join("&");
  var s=document.createElement("script"); s.src=API+"?"+qs+"&callback="+cbn;
  s.onerror=function(){ if(!done){ done=true; clearTimeout(timer); cb(new Error("e")); } };
  document.head.appendChild(s);
}
function post(obj){
  obj.code=gateCode();
  fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(obj)}).catch(function(){});
}
/* ---------- geometry map (id -> {w,h}) from the server ---------- */
var geom={};
function fetchGeom(cb){
  var c=gateCode(); if(!c){ if(cb) cb(); return; }
  jsonp({action:"all",code:c},function(err,d){
    if(!err&&d&&d.ok&&d.notes){
      d.notes.forEach(function(n){ if(n.w) geom[n.id]={w:n.w,h:n.h}; });
      lastSig=sigOf(d.notes);
    }
    if(cb) cb();
  });
}
function sigOf(notes){
  return notes.map(function(n){ return n.id+"|"+n.text+"|"+n.pg+"|"+n.px+"|"+n.py+"|"+(n.w||"")+"|"+(n.h||"")+"|"+(n.img?1:0); }).join(";");
}
var lastSig=null;
/* ---------- render pass: apply widths, resolve overlaps ---------- */
var resolving=false;
function renderPass(){
  if(resolving) return;
  var page=E("nbPage"); if(!page) return;
  var cards=[].slice.call(page.querySelectorAll(".nb-card"));
  if(!cards.length) return;
  resolving=true;
  cards.forEach(function(cd){
    var g=geom[cd.dataset.post];
    if(g&&g.w) cd.style.width=g.w+"%";
  });
  var pw=page.clientWidth, ph=page.clientHeight;
  if(pw&&ph){
    var items=cards.map(function(cd){ return {el:cd, l:cd.offsetLeft, t:cd.offsetTop, w:cd.offsetWidth, h:cd.offsetHeight}; });
    items.sort(function(a,b){ return a.t-b.t||a.l-b.l; });
    var placed=[];
    items.forEach(function(it){
      var moved=true, guard=0;
      while(moved&&guard++<60){
        moved=false;
        for(var i=0;i<placed.length;i++){
          var p=placed[i];
          if(it.l<p.l+p.w&&p.l<it.l+it.w&&it.t<p.t+p.h&&p.t<it.t+it.h){
            it.t=p.t+p.h+4; moved=true;
          }
        }
      }
      if(it.t+it.h>ph) it.t=Math.max(0,ph-it.h);
      it.el.style.top=(it.t/ph*100)+"%";
      placed.push(it);
    });
  }
  resolving=false;
}
var rpTimer=null;
function scheduleRenderPass(){ clearTimeout(rpTimer); rpTimer=setTimeout(renderPass,160); }
/* ---------- record the opener for refresh ---------- */
var lastOpener=null;
document.addEventListener("click",function(e){
  var o=e.target.closest?e.target.closest(".nb-ic,.nb-all-btn"):null;
  if(o) lastOpener=o;
},true);
function overlayOpen(){ var ov=document.querySelector(".nb-overlay.open"); return !!ov; }
function refreshNb(){
  var close=E("nbClose"); if(close) close.click();
  var tries=0;
  var iv=setInterval(function(){
    tries++;
    if(tries>24){ clearInterval(iv); return; }
    if(!overlayOpen()){
      var op=lastOpener||document.querySelector(".nb-all-btn");
      if(op){ op.click(); }
    } else {
      var cov=E("nbCover");
      if(cov&&getComputedStyle(cov).display!=="none"){ var bk=E("nbCoverBook"); (bk||cov).click(); clearInterval(iv); setTimeout(fetchGeom,800); }
      else if(E("nbPgInfo")&&E("nbPgInfo").textContent.indexOf("ページ目")>-1){ clearInterval(iv); setTimeout(fetchGeom,800); }
    }
  },350);
}
/* ---------- textbox geometry: capture form-window size at submit ---------- */
var pendingGeom=null;
document.addEventListener("submit",function(e){
  if(e.target&&e.target.id==="nbForm"){
    var win=E("nbFormWin"), page=E("nbPage");
    if(win&&page&&page.clientWidth){
      var ids={};
      page.querySelectorAll(".nb-card").forEach(function(c){ ids[c.dataset.post]=1; });
      pendingGeom={ w:Math.round(win.offsetWidth/page.clientWidth*1000)/10, h:Math.round(win.offsetHeight/page.clientHeight*1000)/10, at:Date.now(), ids:ids };
    }
  }
},true);
new MutationObserver(function(){
  var page=E("nbPage"); if(!page) return;
  if(pendingGeom&&Date.now()-pendingGeom.at<20000){
    var cards=page.querySelectorAll(".nb-card"), nw=null;
    cards.forEach(function(c){ if(!pendingGeom.ids[c.dataset.post]) nw=c; });
    if(nw){
      var id=nw.dataset.post, g={w:pendingGeom.w,h:pendingGeom.h};
      geom[id]=g; pendingGeom=null;
      nw.style.width=g.w+"%";
      post({action:"box",post:id,tokens:tokensCsv(),name:myName(),w:g.w,h:g.h});
    }
  }
  scheduleRenderPass();
}).observe(document.body,{childList:true,subtree:true});
/* ---------- double-click a note to re-edit (uses the built-in editor) ---------- */
document.addEventListener("dblclick",function(e){
  var page=E("nbPage"); if(!page||!e.target.closest) return;
  var card=e.target.closest(".nb-card");
  if(!card||!page.contains(card)) return;
  var ed=card.querySelector(".nb-edit");
  if(ed){ ed.click(); }
},true);
/* ---------- resize handle on own notes ---------- */
var dragState=null;
document.addEventListener("pointerdown",function(e){
  var h=e.target.closest?e.target.closest(".nb-rsz"):null;
  if(!h) return;
  var card=h.parentElement, page=E("nbPage");
  if(!card||!page) return;
  dragState={card:card,page:page,x:e.clientX,y:e.clientY,w:card.offsetWidth,hh:card.offsetHeight};
  e.preventDefault(); e.stopPropagation();
},true);
document.addEventListener("pointermove",function(e){
  if(!dragState) return;
  var pw=dragState.page.clientWidth, ph=dragState.page.clientHeight;
  var w=Math.max(18,Math.min(96,(dragState.w+(e.clientX-dragState.x))/pw*100));
  var hh=Math.max(6,Math.min(92,(dragState.hh+(e.clientY-dragState.y))/ph*100));
  dragState.card.style.width=w+"%";
  dragState.card.style.height=hh+"%";
  dragState.wPct=w; dragState.hPct=hh;
},true);
document.addEventListener("pointerup",function(){
  if(!dragState) return;
  var id=dragState.card.dataset.post;
  if(id&&dragState.wPct){
    geom[id]={w:Math.round(dragState.wPct*10)/10,h:Math.round(dragState.hPct*10)/10};
    post({action:"box",post:id,tokens:tokensCsv(),name:myName(),w:geom[id].w,h:geom[id].h});
  }
  dragState=null;
  scheduleRenderPass();
},true);
new MutationObserver(function(){
  var page=E("nbPage"); if(!page) return;
  page.querySelectorAll(".nb-card").forEach(function(cd){
    if(cd.querySelector(".nb-edit")&&!cd.querySelector(".nb-rsz")){
      var h=document.createElement("div"); h.className="nb-rsz"; h.title="ドラッグで大きさ変更";
      cd.appendChild(h);
    }
  });
}).observe(document.body,{childList:true,subtree:true});
/* ---------- live refresh: poll for others' edits/deletes ---------- */
var lastInputAt=0;
document.addEventListener("input",function(e){
  if(e.target&&e.target.closest&&e.target.closest(".nb-overlay")) lastInputAt=Date.now();
},true);
setInterval(function(){
  if(!overlayOpen()) return;
  if(document.visibilityState!=="visible") return;
  if(E("nbFormWin")&&E("nbFormWin").classList.contains("open")) return;
  var eb=document.querySelector("#nbPage .nb-editbox");
  if(eb&&eb.offsetHeight>0) return;
  if(Date.now()-lastInputAt<15000) return;
  if(dragState) return;
  var c=gateCode(); if(!c) return;
  jsonp({action:"all",code:c},function(err,d){
    if(err||!d||!d.ok||!d.notes) return;
    d.notes.forEach(function(n){ if(n.w) geom[n.id]={w:n.w,h:n.h}; });
    var s=sigOf(d.notes);
    if(lastSig!==null&&s!==lastSig){ lastSig=s; refreshNb(); }
    else lastSig=s;
  });
},12000);
/* fetch geometry when the notebook opens (transition only) */
var wasOpen=false;
new MutationObserver(function(){
  var now=overlayOpen();
  if(now&&!wasOpen) fetchGeom(function(){ scheduleRenderPass(); });
  wasOpen=now;
}).observe(document.body,{attributes:true,subtree:true,attributeFilter:["class"]});
})();
</script>
