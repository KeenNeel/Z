<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>全関映おみくじ</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 17px; line-height: 1.7; color: #3a2314;
    background:
      radial-gradient(circle at 15% 20%, rgba(255, 205, 92, .14) 0 6px, transparent 7px),
      radial-gradient(circle at 85% 70%, rgba(255, 205, 92, .12) 0 5px, transparent 6px),
      linear-gradient(160deg, #6d0a10 0%, #8f1218 45%, #5d080d 100%);
    background-size: 130px 130px, 170px 170px, cover;
    min-height: 100vh; padding: 18px 10px 40px;
  }
  .frame {
    max-width: 680px; margin: 0 auto; background: #fff8ec;
    border: 3px solid #c9a227; border-radius: 14px;
    box-shadow: 0 0 0 6px #7a0f14, 0 0 0 9px #c9a227, 0 18px 50px rgba(0,0,0,.5);
    padding: 18px 18px 26px; position: relative; overflow: hidden;
  }
  .frame::before, .frame::after {
    content: "❖"; position: absolute; color: #c9a227; font-size: 20px; line-height: 1;
  }
  .frame::before { top: 8px; left: 10px; }
  .frame::after { top: 8px; right: 10px; }
  .banner {
    width: 100%; height: auto; display: block; border-radius: 10px;
    border: 2px solid #c9a227; box-shadow: 0 4px 14px rgba(90, 10, 10, .35);
  }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
    text-align: center; font-size: 34px; letter-spacing: .14em; margin: 16px 0 2px;
    color: #a31621;
  }
  h1 .gold { color: #b8860b; }
  .sub { text-align: center; margin: 0 0 6px; font-size: 15px; color: #6b4a2a; }
  .intro { text-align: center; margin: 6px 12px 0; font-size: 16px; }
  .stage {
    margin: 18px auto 4px; max-width: 420px; background:
      radial-gradient(ellipse at 50% 88%, rgba(0,0,0,.45), transparent 60%),
      linear-gradient(180deg, #a31621, #7c0e15);
    border: 2px solid #c9a227; border-radius: 14px;
    padding: 26px 12px 20px; perspective: 900px; position: relative;
  }
  .cyl-wrap {
    width: min(240px, 62vw); margin: 0 auto; position: relative;
    transform-style: preserve-3d; will-change: transform;
  }
  .cyl-wrap img {
    width: 100%; height: auto; display: block; border-radius: 12px;
    border: 2px solid #e7c65a; box-shadow: 0 10px 24px rgba(0,0,0,.45);
  }
  .cyl-wrap.shaking { animation: shake3d 1.2s ease-in-out; }
  @keyframes shake3d {
    0%, 100% { transform: rotateY(0deg) rotateZ(0deg) translateY(0); }
    8%  { transform: rotateY(-16deg) rotateZ(-5deg) translateY(-7px); }
    18% { transform: rotateY(14deg)  rotateZ(5deg)  translateY(2px); }
    28% { transform: rotateY(-18deg) rotateZ(-6deg) translateY(-8px); }
    38% { transform: rotateY(15deg)  rotateZ(5deg)  translateY(1px); }
    48% { transform: rotateY(-13deg) rotateZ(-4deg) translateY(-6px); }
    58% { transform: rotateY(11deg)  rotateZ(4deg)  translateY(0); }
    68% { transform: rotateY(-8deg)  rotateZ(-3deg) translateY(-4px); }
    78% { transform: rotateY(6deg)   rotateZ(2deg)  translateY(0); }
    88% { transform: rotateY(-3deg)  rotateZ(-1deg) translateY(-1px); }
  }
  .stick {
    position: absolute; left: 50%; top: -8px; width: 40px; height: 168px;
    margin-left: -20px; z-index: 3;
    background: linear-gradient(90deg, #d9b06c, #f3d9a0 45%, #caa257);
    border: 1px solid #8a6a2f; border-radius: 8px 8px 4px 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    transform: translateY(58%); opacity: 0; pointer-events: none;
    transition: transform .65s cubic-bezier(.2, 1.4, .4, 1), opacity .25s;
  }
  .stick.out { transform: translateY(-46%); opacity: 1; }
  .stick .num {
    writing-mode: vertical-rl; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 19px; font-weight: 700; color: #7a0f14; letter-spacing: .12em;
  }
  .controls { text-align: center; margin-top: 20px; }
  button {
    font: inherit; cursor: pointer; border-radius: 999px;
    padding: 15px 34px; font-size: 20px; font-weight: 700; letter-spacing: .06em;
    border: 2px solid #8a6a1f;
    background: linear-gradient(180deg, #e9c65a, #c9a227);
    color: #4a0d10; box-shadow: 0 5px 0 #8a6a1f, 0 10px 18px rgba(0,0,0,.3);
    transition: transform .08s, box-shadow .08s, filter .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.07); }
  button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #8a6a1f, 0 6px 10px rgba(0,0,0,.3); }
  button:disabled { opacity: .55; cursor: wait; }
  button:focus-visible { outline: 3px solid #1450a0; outline-offset: 3px; }
  #againBtn {
    background: #fffdf6; color: #7a0f14; border-color: #a31621;
    box-shadow: 0 4px 0 #a31621, 0 8px 14px rgba(0,0,0,.22); font-size: 17px; padding: 11px 26px;
  }
  #againBtn:active:not(:disabled) { box-shadow: 0 1px 0 #a31621, 0 4px 8px rgba(0,0,0,.22); }
  .result-zone { margin-top: 22px; position: relative; }
  .hint { text-align: center; color: #6b4a2a; margin: 0; }
  .card {
    display: none; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #fffdf6, #fff6e0);
    border: 3px double #a31621; border-radius: 10px;
    padding: 22px 20px 18px; text-align: center;
    box-shadow: 0 10px 26px rgba(122, 15, 20, .28);
  }
  .card.show { display: block; animation: cardIn .55s ease-out; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card .no {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 17px; color: #7a0f14; letter-spacing: .3em; margin: 0;
  }
  .card .grade {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 56px; line-height: 1.15; margin: 4px 0 6px; color: #b01a24;
    text-shadow: 0 2px 0 #f3d9a0;
  }
  .card.bad .grade { color: #4d4550; text-shadow: none; }
  .card .text { font-size: 17px; margin: 8px 4px 14px; }
  .card .lucky {
    display: inline-block; background: #7a0f14; color: #ffe9a8;
    border-radius: 8px; padding: 9px 16px; font-size: 16px; margin: 0;
  }
  .card .lucky b { color: #ffffff; font-size: 18px; }
  .sparkle {
    position: absolute; z-index: 5; pointer-events: none; color: #e9b949;
    animation: sparklePop 1.5s ease-out forwards; text-shadow: 0 0 8px #ffd95e;
  }
  @keyframes sparklePop {
    0% { opacity: 0; transform: scale(.2) rotate(0deg); }
    25% { opacity: 1; transform: scale(1.25) rotate(50deg); }
    100% { opacity: 0; transform: scale(.5) rotate(140deg) translateY(-26px); }
  }
  footer { text-align: center; margin-top: 22px; font-size: 13.5px; color: #6b4a2a; }
  @media (max-width: 480px) {
    h1 { font-size: 27px; }
    .card .grade { font-size: 46px; }
    .frame { padding: 14px 12px 20px; }
    button { font-size: 19px; padding: 14px 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cyl-wrap.shaking { animation-duration: .01s; }
    .card.show { animation: none; }
    .sparkle { display: none; }
    .stick { transition: none; }
  }
</style>
</head>

  o.connect(g); g.connect(ac.destination);
  o.start(start); o.stop(start + dur + 0.05);
}
function playChime(good) {
  var ac = audio(); if (!ac) return;
  var t = ac.currentTime + 0.02;
  if (good) {
    var notes = [659.25, 783.99, 1046.5, 1318.5, 1567.98];
    for (var i = 0; i < notes.length; i++) tone(notes[i], t + i * 0.09, 1.5, 0.16, "sine");
    tone(2093, t + 0.5, 1.1, 0.06, "sine");
  } else {
    tone(392, t, 0.5, 0.14, "triangle");
    tone(329.63, t + 0.22, 0.9, 0.12, "triangle");
    tone(523.25, t + 0.55, 1.2, 0.1, "sine");
  }
}

/* ---------- sparkles ---------- */
function sparkles(host) {
  var chars = ["✦", "✧", "★", "✦", "✧"];
  for (var i = 0; i < 26; i++) {
    var s = document.createElement("span");
    s.className = "sparkle";
    s.textContent = chars[i % chars.length];
    s.style.left = (4 + Math.random() * 92) + "%";
    s.style.top = (2 + Math.random() * 80) + "%";
    s.style.fontSize = (13 + Math.random() * 20) + "px";
    s.style.animationDelay = (Math.random() * 0.35) + "s";
    if (i % 4 === 0) s.style.color = "#fff3b0";
    if (i % 5 === 0) s.style.color = "#e2725b";
    host.appendChild(s);
    (function (el) { setTimeout(function () { el.remove(); }, 2100); })(s);
  }
}

/* ---------- draw flow ---------- */
function kanjiNum(n) {
  var k = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
  if (n === 100) return "百";
  var t = Math.floor(n / 10), o = n % 10;
  return (t ? (t === 1 ? "十" : k[t] + "十") : "") + (o ? k[o] : "");
}
drawBtn.addEventListener("click", function () {
  if (drawing) return;
  drawing = true;
  drawBtn.disabled = true;
  againBtn.hidden = true;
  card.classList.remove("show");
  stick.classList.remove("out");
  hint.textContent = "カラカラカラ……筒を振っています。";
  var f = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
  playRattle(1200);
  cylWrap.classList.remove("shaking");
  void cylWrap.offsetWidth;
  cylWrap.classList.add("shaking");
  setTimeout(function () {
    cylWrap.classList.remove("shaking");
    stickNum.textContent = "第" + kanjiNum(f.n) + "番";
    stick.classList.add("out");
    hint.textContent = "出た札は「第" + f.n + "番」。結果は……";
  }, 1250);
  setTimeout(function () {
    var bad = (f.g === "凶" || f.g === "大凶");
    card.classList.toggle("bad", bad);
    cardNo.textContent = "第 " + kanjiNum(f.n) + " 番";
    cardGrade.textContent = f.g;
    cardText.textContent = f.t;
    cardFilm.textContent = f.f;
    card.classList.add("show");
    sparkles(stage);
    sparkles(card);
    playChime(!bad);
    hint.textContent = bad
      ? "結んで厄を置いていくもよし、明日の巻き返しに期待するもよし。"
      : "よい札が出ました。ラッキー映画もぜひアーカイブでどうぞ。";
    againBtn.hidden = false;
    drawBtn.disabled = false;
    drawing = false;
    againBtn.focus();
  }, 2050);
});
againBtn.addEventListener("click", function () {
  if (drawing) return;
  stick.classList.remove("out");
  card.classList.remove("show");
  againBtn.hidden = true;
  hint.textContent = "筒をよく振ってから、札が飛び出すのを待ちましょう。";
  drawBtn.focus();
});
</script>
